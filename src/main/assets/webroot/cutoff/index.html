<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>try{const p=JSON.parse(localStorage.getItem('acol.theme.preference'));document.documentElement.dataset.theme=(p?.step==='auto'||!p?.step)?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(p.dark?'dark':'light')}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
  <title>截止电压调整</title>
  <link rel="stylesheet" href="style.css?v=acol-1.3.2">
</head>
<body>
  <main>
    <header><div class="page-heading"><a class="back" href="../index.html">返回</a><h1>截止电压调整</h1></div></header>
    <section class="card" aria-labelledby="liveTitle">
      <div class="section-title"><h2 id="liveTitle">当前截止电压</h2><button id="refresh" type="button">刷新</button></div>
      <dl>
        <div><dt>电量计截止电压</dt><dd id="termLive">—</dd></div>
        <div><dt>软件关机电压</dt><dd id="shutdownLive">—</dd></div>
      </dl>
    </section>
    <section class="card primary" aria-labelledby="editTitle">
      <h2 id="editTitle">调整电压</h2>
      <form id="voltageForm">
        <label for="termInput">电量计截止电压 <span>mV</span></label>
        <input id="termInput" type="number" inputmode="none" min="2500" max="3500" step="1" required readonly aria-haspopup="dialog" disabled>
        <label for="shutdownInput">软件关机电压 <span>mV</span></label>
        <input id="shutdownInput" type="number" inputmode="none" min="2500" max="3500" step="1" required readonly aria-haspopup="dialog" disabled>
        <p class="note">两项电压均可设置为 2500–3500 mV。</p>
        <div class="actions"><button id="restore" type="button" disabled>恢复厂商截止电压</button><button id="apply" class="accent" type="submit" disabled>确认修改…</button></div>
      </form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <footer>两个电压设置一般接近，可独立设置。<br>关机/进入超级省电可能取决于电量计截止电压。<br>仅在确认后修改一次，系统重启后可能需要重新设置。</footer>
  </main>
  <dialog id="confirmation" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle"></h2><p id="confirmText"></p>
    <div class="dialog-actions"><button id="cancel" type="button">取消</button><button id="confirm" class="accent" type="button">确定</button></div>
  </dialog>
  <dialog id="lowVoltageConfirmation" aria-labelledby="lowVoltageTitle">
    <h2 id="lowVoltageTitle">低电压风险确认</h2><p id="lowVoltageText"></p>
    <div class="dialog-actions"><button id="lowVoltageCancel" type="button">取消</button><button id="lowVoltageConfirm" type="button">确认应用</button></div>
  </dialog>
  <dialog id="cutoffKeypad" class="numeric-keypad" aria-labelledby="cutoffKeypadTitle">
    <div class="keypad-heading"><h3 id="cutoffKeypadTitle">修改电压</h3><div class="keypad-heading-actions"><small id="cutoffKeypadRange" class="keypad-range"></small><button id="cutoffKeypadCancel" type="button" aria-label="取消修改">取消</button><button id="cutoffKeypadApply" class="keypad-apply" type="button">确认</button></div></div>
    <div class="keypad-readout"><output id="cutoffKeypadValue"></output><span>mV</span></div>
    <p id="cutoffKeypadError" class="keypad-error" role="status" hidden></p>
    <div class="keypad-grid"><button type="button" data-key="sign" aria-label="切换正负号">−</button><button type="button" data-key="clear">清空</button><button type="button" data-key="backspace" aria-label="退格">⌫</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="00">00</button><button type="button" data-key="0">0</button><button type="button" data-key="dot">.</button></div>
  </dialog>
  <script type="module" src="app.js?v=acol-1.3.2"></script>
</body>
</html>
